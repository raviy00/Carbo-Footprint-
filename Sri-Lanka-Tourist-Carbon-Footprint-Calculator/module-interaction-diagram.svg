<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Module Interaction Diagram</title>
  <desc id="desc">Web interface navigation flow, machine learning pipeline, and IoT telemetry flow for the Sri Lanka Tourist Carbon Footprint Calculator project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7faf8"/>
      <stop offset="100%" stop-color="#eef4ef"/>
    </linearGradient>
    <linearGradient id="uiFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef8f2"/>
    </linearGradient>
    <linearGradient id="mlFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f7ff"/>
    </linearGradient>
    <linearGradient id="iotFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff6ed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35523f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d4f7a"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .panel { stroke: #cfded4; stroke-width: 2; rx: 24; ry: 24; }
      .panel-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #183024; }
      .module { stroke-width: 2; rx: 16; ry: 16; }
      .module-title { font: 600 20px 'Segoe UI', Arial, sans-serif; fill: #163022; }
      .module-sub { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #51645b; }
      .arrow-label { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #4a5b52; }
      .small-label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #51645b; }
      .section-note { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #5d6f65; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" rx="0" ry="0"/>

  <text x="800" y="48" text-anchor="middle" class="panel-title">Module Interaction Diagram</text>
  <text x="800" y="74" text-anchor="middle" class="section-note">Navigation flow in the web UI, data flow into the ML pipeline, and telemetry flow from IoT modules</text>

  <!-- UI panel -->
  <rect x="60" y="110" width="1480" height="250" class="panel" fill="url(#uiFill)"/>
  <text x="90" y="145" class="panel-title">Web Interface Modules</text>

  <g>
    <rect x="90" y="175" width="145" height="76" class="module" fill="#f7fcf8" stroke="#98bca7"/>
    <text x="162" y="207" text-anchor="middle" class="module-title">Home</text>
    <text x="162" y="229" text-anchor="middle" class="module-sub">Entry point</text>

    <rect x="260" y="175" width="145" height="76" class="module" fill="#f7fcf8" stroke="#98bca7"/>
    <text x="333" y="200" text-anchor="middle" class="module-title">Tourist Info</text>
    <text x="333" y="222" text-anchor="middle" class="module-sub">Step 1</text>

    <rect x="430" y="175" width="170" height="76" class="module" fill="#f7fcf8" stroke="#98bca7"/>
    <text x="515" y="200" text-anchor="middle" class="module-title">Airport Selection</text>
    <text x="515" y="222" text-anchor="middle" class="module-sub">Arrival and departure</text>

    <rect x="625" y="175" width="150" height="76" class="module" fill="#f7fcf8" stroke="#98bca7"/>
    <text x="700" y="200" text-anchor="middle" class="module-title">City Selection</text>
    <text x="700" y="222" text-anchor="middle" class="module-sub">Destinations</text>

    <rect x="800" y="175" width="150" height="76" class="module" fill="#f7fcf8" stroke="#98bca7"/>
    <text x="875" y="200" text-anchor="middle" class="module-title">Hotel Selection</text>
    <text x="875" y="222" text-anchor="middle" class="module-sub">Per-day stays</text>

    <rect x="975" y="175" width="150" height="76" class="module" fill="#f7fcf8" stroke="#98bca7"/>
    <text x="1050" y="200" text-anchor="middle" class="module-title">Vehicle Selection</text>
    <text x="1050" y="222" text-anchor="middle" class="module-sub">Transport mode</text>

    <rect x="1150" y="175" width="150" height="76" class="module" fill="#f7fcf8" stroke="#98bca7"/>
    <text x="1225" y="200" text-anchor="middle" class="module-title">Meal Selection</text>
    <text x="1225" y="222" text-anchor="middle" class="module-sub">Activity inputs</text>

    <rect x="1325" y="175" width="170" height="76" class="module" fill="#f7fcf8" stroke="#98bca7"/>
    <text x="1410" y="200" text-anchor="middle" class="module-title">Activity Selection</text>
    <text x="1410" y="222" text-anchor="middle" class="module-sub">Timeline planning</text>

    <rect x="1345" y="275" width="150" height="60" class="module" fill="#eaf7ef" stroke="#4f8a68"/>
    <text x="1420" y="301" text-anchor="middle" class="module-title">Summary Results</text>
    <text x="1420" y="321" text-anchor="middle" class="module-sub">Final output</text>
  </g>

  <!-- UI navigation arrows -->
  <g stroke="#35523f" stroke-width="3.2" fill="none" marker-end="url(#arrow)">
    <line x1="235" y1="213" x2="260" y2="213"/>
    <line x1="405" y1="213" x2="430" y2="213"/>
    <line x1="600" y1="213" x2="625" y2="213"/>
    <line x1="775" y1="213" x2="800" y2="213"/>
    <line x1="950" y1="213" x2="975" y2="213"/>
    <line x1="1125" y1="213" x2="1150" y2="213"/>
    <line x1="1300" y1="213" x2="1325" y2="213"/>
    <line x1="1410" y1="251" x2="1410" y2="275"/>
  </g>
  <text x="1435" y="255" class="arrow-label">navigation</text>

  <!-- ML panel -->
  <rect x="120" y="410" width="1360" height="200" class="panel" fill="url(#mlFill)"/>
  <text x="150" y="445" class="panel-title">ML Pipeline</text>

  <g>
    <rect x="200" y="470" width="250" height="86" class="module" fill="#f7fbff" stroke="#8aa8c8"/>
    <text x="325" y="503" text-anchor="middle" class="module-title">Input Processing</text>
    <text x="325" y="526" text-anchor="middle" class="module-sub">Feature preparation</text>

    <rect x="525" y="470" width="250" height="86" class="module" fill="#f7fbff" stroke="#8aa8c8"/>
    <text x="650" y="503" text-anchor="middle" class="module-title">XGBoost Prediction</text>
    <text x="650" y="526" text-anchor="middle" class="module-sub">Impact scoring / class</text>

    <rect x="850" y="470" width="250" height="86" class="module" fill="#f7fbff" stroke="#8aa8c8"/>
    <text x="975" y="503" text-anchor="middle" class="module-title">LLM Recommendation</text>
    <text x="975" y="526" text-anchor="middle" class="module-sub">Guidance text</text>

    <rect x="1175" y="470" width="220" height="86" class="module" fill="#ecf5fb" stroke="#5f88b0"/>
    <text x="1285" y="503" text-anchor="middle" class="module-title">Summary Results</text>
    <text x="1285" y="526" text-anchor="middle" class="module-sub">Recommendations shown</text>
  </g>

  <g stroke="#2d4f7a" stroke-width="3.2" fill="none" marker-end="url(#arrowBlue)">
    <line x1="450" y1="513" x2="525" y2="513"/>
    <line x1="775" y1="513" x2="850" y2="513"/>
    <line x1="1100" y1="513" x2="1175" y2="513"/>
  </g>
  <text x="470" y="495" class="arrow-label" fill="#2d4f7a">feature vectors</text>
  <text x="795" y="495" class="arrow-label" fill="#2d4f7a">impact score / class</text>
  <text x="1118" y="495" class="arrow-label" fill="#2d4f7a">recommendation text</text>

  <!-- IoT panel -->
  <rect x="220" y="660" width="1160" height="180" class="panel" fill="url(#iotFill)"/>
  <text x="250" y="695" class="panel-title">IoT Modules</text>

  <g>
    <rect x="310" y="720" width="260" height="78" class="module" fill="#fffaf4" stroke="#c99b63"/>
    <text x="440" y="752" text-anchor="middle" class="module-title">Sensor Acquisition</text>
    <text x="440" y="774" text-anchor="middle" class="module-sub">GPS / telemetry sensors</text>

    <rect x="675" y="720" width="270" height="78" class="module" fill="#fffaf4" stroke="#c99b63"/>
    <text x="810" y="752" text-anchor="middle" class="module-title">Telemetry Transmission</text>
    <text x="810" y="774" text-anchor="middle" class="module-sub">Send travel data outward</text>

    <rect x="1085" y="720" width="190" height="78" class="module" fill="#fff6eb" stroke="#bb8641"/>
    <text x="1180" y="752" text-anchor="middle" class="module-title">Input Processing</text>
    <text x="1180" y="774" text-anchor="middle" class="module-sub">Transport data merge</text>
  </g>

  <g stroke="#8a5a2b" stroke-width="3.2" fill="none" marker-end="url(#arrowOrange)">
    <line x1="570" y1="759" x2="675" y2="759"/>
    <line x1="945" y1="759" x2="1085" y2="759"/>
  </g>
  <text x="589" y="742" class="arrow-label" fill="#8a5a2b">sensor readings</text>
  <text x="948" y="742" class="arrow-label" fill="#8a5a2b">travel telemetry</text>

  <!-- Cross-flow from UI to ML and IoT to UI/results -->
  <g stroke="#4b6b59" stroke-width="2.6" fill="none" marker-end="url(#arrow)">
    <path d="M 333 251 C 333 330, 320 360, 325 470"/>
    <path d="M 515 251 C 515 330, 470 360, 325 470"/>
    <path d="M 700 251 C 700 330, 640 360, 650 470"/>
    <path d="M 875 251 C 875 330, 790 360, 650 470"/>
    <path d="M 1050 251 C 1050 330, 920 360, 650 470"/>
    <path d="M 1225 251 C 1225 330, 1050 360, 650 470"/>
    <path d="M 1410 251 C 1410 335, 1180 360, 650 470"/>
    <path d="M 1410 350 C 1410 395, 1360 430, 1285 470"/>
    <path d="M 810 798 C 980 840, 1170 845, 1285 556"/>
  </g>
  <text x="285" y="365" class="section-note">trip details</text>
  <text x="465" y="365" class="section-note">arrival / departure data</text>
  <text x="635" y="365" class="section-note">destination data</text>
  <text x="825" y="365" class="section-note">hotel data</text>
  <text x="980" y="365" class="section-note">vehicle data</text>
  <text x="1160" y="365" class="section-note">meal selections</text>
  <text x="1338" y="365" class="section-note">activity data</text>
  <text x="1310" y="435" class="section-note">recommendations shown in summary</text>

  <text x="80" y="858" class="section-note">The diagram is sized for README use and can be opened directly as an image asset in the editor or browser.</text>
</svg>
